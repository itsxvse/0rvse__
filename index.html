<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070a;color:#dce7f3;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
body{display:grid;place-items:center;padding:24px;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(40,120,255,.12),transparent 34%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,32px 32px;pointer-events:none}
.card{width:min(680px,100%);border:1px solid #173047;border-radius:22px;padding:34px;background:rgba(5,9,14,.82);box-shadow:0 20px 80px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
.top{display:flex;align-items:center;gap:10px;color:#71869a;font-size:13px;margin-bottom:28px}.dot{width:9px;height:9px;border-radius:50%;background:#62b4ff;box-shadow:0 0 14px #62b4ff}
h1{font-size:clamp(42px,10vw,76px);letter-spacing:-5px;margin:0;color:#f4f8fc}h1 span{color:#5dafff}
.tag{margin:10px 0 28px;color:#78a9d2;font-size:14px}
.terminal{border:1px solid #14293b;border-radius:14px;padding:20px;background:#030507;line-height:1.8;color:#b9cbe0}
.prompt{color:#65b5ff}.cursor{display:inline-block;width:8px;height:17px;background:#65b5ff;vertical-align:-3px;margin-left:4px;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.links a{color:#dce7f3;text-decoration:none;border:1px solid #19364f;border-radius:11px;padding:11px 16px;background:#07101a;transition:.2s}.links a:hover{border-color:#5dafff;transform:translateY(-2px);box-shadow:0 0 20px rgba(93,175,255,.12)}
footer{margin-top:28px;color:#50667a;font-size:11px}
@media(max-width:520px){.card{padding:26px 20px;border-radius:18px}h1{letter-spacing:-3px}.terminal{font-size:13px}}
</style>
</head>
<body>
<main class="card">
